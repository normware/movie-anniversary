name: Node security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - name: Check JavaScript syntax
        run: find scripts -type f -name '*.js' -exec node --check {} \;
